name: ZeroLink build
on:
  push:
    branches: [zerolink-offline]
    paths: ['zerolink/**', '.github/workflows/zerolink-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zerolink/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ZeroLink.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroLink-Windows
          path: |
            zerolink/desktop/ZeroLink.exe
            zerolink/desktop/install-autostart.cmd
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zerolink/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroLink-Android
          path: zerolink/android/build/outputs/apk/debug/*.apk
